services:
  - type: web
    name: ajaia-docs
    runtime: node
    buildCommand: npm install --prefix frontend && npm install --prefix backend && npm run build --prefix frontend
    startCommand: npm start --prefix backend
    healthCheckPath: /health
    disk:
      name: ajaia-docs-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/database.sqlite
